name: Build and publish image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A SyntaxError anywhere in an inline <script> kills that whole block,
      # so the page silently does nothing. That shipped once (a duplicate
      # `const url` broke the gallery entirely) because the backend was
      # tested via curl and the page was never loaded afterwards.
      - name: Syntax-check inline page JavaScript
        run: |
          python3 - <<'EOF'
          import re, pathlib, subprocess, sys
          fail = False
          for f in pathlib.Path("service/static").glob("*.html"):
              for i, js in enumerate(re.findall(r"<script>(.*?)</script>", f.read_text(), re.S)):
                  p = pathlib.Path(f"/tmp/{f.name}.{i}.js"); p.write_text(js)
                  r = subprocess.run(["node", "--check", str(p)], capture_output=True, text=True)
                  print(f"{f.name}[{i}]: {'OK' if r.returncode == 0 else 'SYNTAX ERROR'}")
                  if r.returncode:
                      print(r.stderr); fail = True
          sys.exit(1 if fail else 0)
          EOF

      # Parsing is not enough. Twice a string edit added an argument to a
      # call site whose function had no such parameter -- the module imported
      # cleanly and only blew up on a real request, once shipping a broken
      # editor preview. This calls every route the UI calls.
      - name: Smoke-test the API routes
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r service/requirements.txt httpx
          python service/smoke_test.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: service/Dockerfile
          push: true
          tags: ghcr.io/akopmm/photo-enhance:latest
