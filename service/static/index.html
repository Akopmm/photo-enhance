<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>photo-enhance</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 900px; margin-inline: auto; }
  h1 { font-size: 1.3rem; }
  nav { display: flex; gap: 0.5rem; margin-bottom: 1rem; border-bottom: 1px solid #8883; padding-bottom: 0.5rem; }
  nav button { padding: 0.5rem 1rem; border: none; background: none; font-size: 1rem; cursor: pointer; border-radius: 6px; }
  nav button.active { background: #7c7cf5; color: white; }
  section { display: none; }
  section.active { display: block; }
  select, input[type=file] { font-size: 16px; padding: 0.4rem; margin-bottom: 0.75rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.6rem; }
  .thumb { position: relative; cursor: pointer; border-radius: 8px; overflow: hidden; aspect-ratio: 1; background: #8882; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.busy::after { content: "processing…"; position: absolute; inset: 0; background: #000a; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  .import-card { border: 1px solid #8883; border-radius: 10px; padding: 0.75rem; margin-bottom: 1rem; }
  .import-card h3 { margin: 0 0 0.5rem; font-size: 0.95rem; word-break: break-all; }
  .styles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.5rem; }
  .styles-grid figure { margin: 0; }
  .styles-grid img { width: 100%; border-radius: 6px; display: block; }
  .styles-grid figcaption { font-size: 0.72rem; text-align: center; margin-top: 0.2rem; }
  .styles-grid a, .styles-grid button.dl-style { text-decoration: none; color: inherit; display: block; width: 100%; padding: 0; border: none; background: none; font: inherit; cursor: pointer; position: relative; }
  .styles-grid button.dl-style.busy img { opacity: 0.4; }
  .styles-grid button.dl-style.busy::after { content: "rendering…"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; background: #0006; border-radius: 6px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .crop-row { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .crop-opt { display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
              width: 92px; padding: 0.3rem; border-radius: 8px; cursor: pointer;
              border: 1px solid #8886; background: none; color: inherit; font: inherit; }
  .crop-opt img { width: 100%; height: 62px; object-fit: contain; border-radius: 4px; background: #8881; }
  .crop-opt span { font-size: 0.7rem; }
  .crop-opt em { font-size: 0.62rem; opacity: 0.6; font-style: normal; }
  .crop-opt.active { border-color: #7c7cf5; box-shadow: 0 0 0 1px #7c7cf5; }
  .strength-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
  .strength-row input[type=range] { flex: 1; min-width: 0; accent-color: #7c7cf5; }
  .strength-row output { font-size: 0.72rem; min-width: 2.8rem; text-align: right;
                         font-variant-numeric: tabular-nums; opacity: 0.75; }
  button.small { font-size: 0.8rem; padding: 0.3rem 0.6rem; border-radius: 6px; border: 1px solid #8886; background: none; cursor: pointer; }
  #status { font-size: 0.85rem; opacity: 0.7; margin-bottom: 0.5rem; min-height: 1.2em; }

  /* --- mobile / a11y pass (measured at 390px, 2026-08-25) --- */
  /* 16px is the threshold below which iOS Safari zooms the page when an
     input takes focus. Set at each control's own rule above rather than here:
     a bare `input` selector (0,0,1) loses to `input[type=text]` (0,1,1) no
     matter how late it appears. */
  /* Comfortable touch targets. Measured buttons were 33-35px and the
     "Gallery" link only 19px tall. */
  button, .crop-opt { min-height: 40px; }
  a.navlink { display: inline-block; padding: 0.55rem 0.25rem; }
  /* Nothing defined a focus style at all, so keyboard users were relying on
     whatever the UA happened to draw. */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid #7c7cf5; outline-offset: 2px; border-radius: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  /* Side-by-side form fields squeeze to ~100px on a phone and their labels
     wrap onto two lines; stack them instead. */
  @media (max-width: 560px) {
    .row { flex-direction: column; gap: 0; }
    .row > div { width: 100%; }
  }
</style>
</head>
<body>

<div style="display:flex; justify-content:space-between; align-items:center;">
  <h1 style="margin:0;">photo-enhance</h1>
  <div style="font-size:0.85rem;">
    <span id="whoami" style="opacity:0.6;"></span>
    <a href="/settings" style="margin-left:0.6rem; color:#7c7cf5;">Settings</a>
  </div>
</div>
<div id="status"></div>

<nav>
  <button data-tab="immich" class="active">Browse Immich</button>
  <button data-tab="upload">Upload</button>
  <button data-tab="gallery">Gallery</button>
</nav>

<section id="tab-immich" class="active">
  <select id="album-select"><option value="">All photos</option></select>
  <div id="immich-grid" class="grid"></div>
</section>

<section id="tab-upload">
  <p>Drag a CR3 / ARW / JPEG here, or pick a file:</p>
  <input type="file" id="file-input" accept=".cr3,.arw,.dng,.cr2,.nef,.jpg,.jpeg,.png" />
</section>

<section id="tab-gallery">
  <div id="gallery-list"></div>
</section>

<script>
const statusEl = document.getElementById('status');
function setStatus(msg, isError) {
  statusEl.textContent = msg || '';
  statusEl.style.color = isError ? '#e5484d' : '';
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'gallery') loadGallery();
  });
});

// ---- Immich browse ----
async function loadAlbums() {
  try {
    const albums = await fetch('/api/immich/albums').then(r => r.json());
    const sel = document.getElementById('album-select');
    for (const a of albums) {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = `${a.albumName} (${a.assetCount})`;
      sel.appendChild(opt);
    }
  } catch (e) {
    setStatus('Could not load Immich albums: ' + e, true);
  }
}

let currentAlbumId = '';
let currentNextPage = null;
let loadingMore = false;

function appendImmichThumbs(items) {
  const grid = document.getElementById('immich-grid');
  for (const a of items) {
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.src = `/api/immich/thumbnail/${a.id}`;
    img.loading = 'lazy';
    div.appendChild(img);
    div.title = a.originalFileName;
    div.addEventListener('click', () => importFromImmich(a.id, div));
    grid.appendChild(div);
  }
}

function renderLoadMoreButton() {
  let btn = document.getElementById('load-more-btn');
  if (btn) btn.remove();
  if (!currentNextPage) return;
  btn = document.createElement('button');
  btn.id = 'load-more-btn';
  btn.className = 'small';
  btn.style.cssText = 'display:block; margin:1rem auto; padding:0.5rem 1.2rem;';
  btn.textContent = 'Load more';
  btn.addEventListener('click', loadMoreImmich);
  document.getElementById('tab-immich').appendChild(btn);
}

async function loadImmichGrid(albumId) {
  currentAlbumId = albumId;
  currentNextPage = null;
  document.getElementById('immich-grid').innerHTML = '';
  await loadMoreImmich();
}

async function loadMoreImmich() {
  if (loadingMore) return;
  loadingMore = true;
  const params = new URLSearchParams();
  if (currentAlbumId) params.set('album_id', currentAlbumId);
  if (currentNextPage) params.set('page', currentNextPage);
  try {
    const result = await fetch('/api/immich/search?' + params.toString()).then(r => r.json());
    appendImmichThumbs(result.items);
    currentNextPage = result.nextPage;
    renderLoadMoreButton();
  } catch (e) {
    setStatus('Could not load photos: ' + e, true);
  } finally {
    loadingMore = false;
  }
}

async function importFromImmich(assetId, el) {
  el.classList.add('busy');
  setStatus('Processing…');
  try {
    const res = await fetch(`/api/import/immich/${assetId}`, { method: 'POST' }).then(r => r.json());
    setStatus('Done — check the Gallery tab.');
  } catch (e) {
    setStatus('Processing failed: ' + e, true);
  } finally {
    el.classList.remove('busy');
  }
}

document.getElementById('album-select').addEventListener('change', e => loadImmichGrid(e.target.value));

// ---- Upload ----
document.getElementById('file-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  setStatus('Uploading and processing…');
  const form = new FormData();
  form.append('file', file);
  try {
    await fetch('/api/import/upload', { method: 'POST', body: form }).then(r => r.json());
    setStatus('Done — check the Gallery tab.');
  } catch (e) {
    setStatus('Processing failed: ' + e, true);
  }
});

// ---- Gallery ----
async function loadGallery() {
  const list = document.getElementById('gallery-list');
  list.innerHTML = 'Loading…';
  const imports = await fetch('/api/gallery').then(r => r.json());
  list.innerHTML = '';
  if (imports.length === 0) {
    list.innerHTML = '<p>No imports yet.</p>';
    return;
  }
  for (const imp of imports) {
    const card = document.createElement('div');
    card.className = 'import-card';
    const date = new Date(imp.created_at * 1000).toLocaleString();
    card.innerHTML = `
      <div class="row">
        <h3>${imp.source_name}</h3>
        <button class="small" data-del="${imp.id}">Delete</button>
      </div>
      <div style="font-size:0.75rem; opacity:0.6; margin-bottom:0.5rem;">${date}</div>
      ${(imp.crops && imp.crops.length) ? `
      <div style="margin-bottom:0.6rem;">
        <div style="font-size:0.75rem; opacity:0.7; margin-bottom:0.3rem;">
          Suggested crops <span style="opacity:0.6">— pick a style below, then a crop</span>
        </div>
        <div class="crop-row">
          <button class="crop-opt active" data-crop="">
            <img src="/api/gallery/${imp.id}/original_thumb.jpg" loading="lazy" />
            <span>Full frame</span>
          </button>
          ${imp.crops.map(c => `
          <button class="crop-opt" data-crop="${c.key}" title="${c.rationale}">
            <img src="/api/gallery/${imp.id}/crop_${c.key}_thumb.jpg" loading="lazy" />
            <span>${c.label}</span>
            <em>${c.subject_coverage !== undefined && c.subject_coverage < 0.999
                  ? Math.round(c.subject_coverage*100) + '% of subject'
                  : Math.round(c.kept_fraction*100) + '% of frame'}</em>
          </button>`).join('')}
        </div>
      </div>` : ''}
      ${(imp.region_recipes && imp.region_recipes.length) ? `
      <div class="strength-row">
        <label for="str-${imp.id}" style="font-size:0.75rem; opacity:0.7;">Region strength</label>
        <input type="range" id="str-${imp.id}" min="0" max="100" step="5" value="100" />
        <output for="str-${imp.id}">100%</output>
      </div>` : ''}
      <div class="styles-grid">
        <figure>
          <img src="/api/gallery/${imp.id}/original_thumb.jpg" loading="lazy" />
          <figcaption>Original</figcaption>
        </figure>
        ${imp.styles.map(s => `
          <figure>
            <button class="dl-style" data-import="${imp.id}" data-style="${s.key}" data-name="${imp.source_name}" title="Click to render full resolution and download">
              <img src="/api/gallery/${imp.id}/${s.key}_thumb.jpg" loading="lazy" />
              <figcaption>${s.label}</figcaption>
            </button>
          </figure>`).join('')}
      </div>
    `;
    card.querySelector('[data-del]').addEventListener('click', async () => {
      await fetch(`/api/gallery/${imp.id}`, { method: 'DELETE' });
      loadGallery();
    });
    // Region strength only affects the region-aware recipes; the global
    // styles ignore it, so the slider is not shown unless this import has
    // some, and downloadFullRes only sends it for those keys.
    card.dataset.regionStyles = JSON.stringify(imp.region_recipes || []);
    const strengthInput = card.querySelector('.strength-row input');
    if (strengthInput) {
      const out = card.querySelector('.strength-row output');
      strengthInput.addEventListener('input', () => {
        card.dataset.strength = strengthInput.value;
        out.textContent = strengthInput.value + '%';
      });
    }
    card.querySelectorAll('.dl-style').forEach(btn => {
      btn.addEventListener('click', () => downloadFullRes(btn, card.dataset.crop || '',
                                                          card.dataset.strength,
                                                          card.dataset.regionStyles));
    });
    card.querySelectorAll('.crop-opt').forEach(pill => {
      pill.addEventListener('click', () => {
        card.querySelectorAll('.crop-opt').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        card.dataset.crop = pill.dataset.crop;
        const name = pill.querySelector('span') ? pill.querySelector('span').textContent : 'crop';
        setStatus(pill.dataset.crop
          ? `Crop "${name}" selected — downloads from this photo will use it.`
          : 'Full frame selected.');
      });
    });
    list.appendChild(card);
  }
}

async function downloadFullRes(btn, cropKey, strength, regionStylesJson) {
  if (btn.classList.contains('busy')) return;
  const { import: importId, style, name } = btn.dataset;
  btn.classList.add('busy');
  setStatus('Rendering full resolution… (first time only, ~10-20s)');
  try {
    const params = new URLSearchParams();
    if (cropKey) params.set('crop', cropKey);
    let regionStyles = [];
    try { regionStyles = JSON.parse(regionStylesJson || '[]'); } catch (e) { regionStyles = []; }
    const pct = Number(strength);
    if (regionStyles.includes(style) && Number.isFinite(pct) && pct < 100) {
      params.set('strength', (pct / 100).toFixed(2));
    }
    const qs = params.toString();
    const reqUrl = `/api/gallery/${importId}/${style}.jpg` + (qs ? `?${qs}` : '');
    const res = await fetch(reqUrl);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = objUrl;
    const strSuffix = params.has('strength') ? '_' + Math.round(pct) + 'pct' : '';
    a.download = `${name}_${style}${cropKey ? '_' + cropKey : ''}${strSuffix}.jpg`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(objUrl);
    setStatus('Downloaded.');
  } catch (e) {
    setStatus('Full-resolution render failed: ' + e, true);
  } finally {
    btn.classList.remove('busy');
  }
}

fetch('/api/me').then(r => r.json()).then(m => {
  document.getElementById('whoami').textContent = m.username || '';
  if (!m.immich_api_key_set) {
    setStatus('No Immich API key configured yet — add one in Settings to browse your library.', true);
  }
}).catch(() => {});

loadAlbums();
loadImmichGrid('');
</script>

</body>
</html>
