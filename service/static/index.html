<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>photo-enhance</title>
<style>
  /* Dark by default: this is a photo tool, and a neutral dark ground stops
     the UI competing with the image for attention. */
  :root {
    --bg:        #101215;
    --surface:   #191C21;
    --surface-2: #22262D;
    --line:      #2C313A;
    --text:      #ECEEF1;
    --text-dim:  #9BA3AF;
    --accent:    #6E8BFF;
    --accent-in: #0B0E14;
    --danger:    #E8827D;
    --ok:        #7DBE96;
    --radius:    12px;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    /* dvh, not vh: on iOS Safari `vh` is the height WITHOUT browser chrome,
       so a 100vh layout sits partly under the address bar. dvh tracks the
       chrome as it hides and shows. */
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;          /* the app frame is fixed; panes scroll */
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- header ---------- */
  header {
    flex: none; z-index: 20;
    display: flex; align-items: center; gap: .75rem;
    padding: .7rem 1rem;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header .title { font-size: 1rem; font-weight: 600; flex: 1; min-width: 0;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .meta { font-size: .8rem; color: var(--text-dim); display: flex; gap: .7rem; align-items: center; }
  header a { color: var(--accent); text-decoration: none; }
  .icon-btn {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; min-width: 40px; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: var(--line); }
  .icon-btn.danger { border-color: var(--danger); color: var(--danger); }
  /* A confirmation must not move or time out under the pointer. The first
     attempt reshaped the button in place and auto-disarmed after 5s, so the
     second click could land on empty space -- caught in testing, where the
     delete silently did nothing. */
  .confirm-pop {
    position: absolute; top: calc(100% + .5rem); right: 1rem; z-index: 30;
    background: var(--surface); border: 1px solid var(--danger);
    border-radius: 12px; padding: .9rem; width: min(320px, calc(100vw - 2rem));
    box-shadow: 0 12px 32px #000A;
  }
  .confirm-pop p { margin: 0 0 .8rem; font-size: .87rem; color: var(--text); }
  .confirm-pop .sub { color: var(--text-dim); font-size: .8rem; }
  .confirm-pop .actions { display: flex; gap: .5rem; justify-content: flex-end; }
  .btn.destructive { background: var(--danger); color: #1A0E0E; }

  main {
    flex: 1; min-height: 0;                 /* min-height:0 or flex children refuse to shrink */
    padding: 1rem;
    padding-bottom: max(1rem, env(safe-area-inset-bottom));
  }
  /* The library is a reading surface, so it stays measured and scrolls.
     The editor is a working surface and takes the whole frame. */
  #view-library { max-width: 1400px; margin-inline: auto; overflow-y: auto; width: 100%; }
  #view-editor  { overflow: hidden; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 1.25rem; transform: translateX(-50%) translateY(150%);
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    padding: .6rem 1rem; border-radius: 999px; font-size: .87rem; z-index: 60;
    transition: transform .25s ease; max-width: 90vw; text-align: center;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { border-color: var(--danger); color: var(--danger); }

  /* ---------- library ---------- */
  .lib-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 1rem; }
  .lib-head h2 { margin: 0; font-size: 1.15rem; }
  .btn {
    background: var(--accent); color: var(--accent-in); border: none; font-weight: 600;
    padding: .65rem 1.1rem; border-radius: 10px; min-height: 44px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .btn:disabled { opacity: .5; cursor: default; filter: none; }

  .lib-grid { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .tile {
    position: relative; aspect-ratio: 4/3; border-radius: var(--radius); overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); padding: 0; display: block;
    transition: transform .14s ease, border-color .14s ease;
  }
  .tile:hover { transform: translateY(-2px); border-color: var(--accent); }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .cap {
    position: absolute; inset-inline: 0; bottom: 0; padding: .8rem .6rem .45rem;
    font-size: .72rem; text-align: left;
    background: linear-gradient(transparent, #000C);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tile .badge {
    position: absolute; top: .45rem; left: .45rem; font-size: .64rem; letter-spacing: .04em;
    background: #000A; padding: .2rem .45rem; border-radius: 999px; text-transform: uppercase;
  }
  .tile.pending { display: grid; place-items: center; }
  .tile.pending .cap { background: none; }
  .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 2.4s; }
    .tile, #toast, .bar > i { transition: none; }
  }
  .empty { text-align: center; color: var(--text-dim); padding: 3rem 1rem; }

  /* ---------- picker sheet ---------- */
  .sheet-back { position: fixed; inset: 0; background: #000B; z-index: 40; }
  .sheet {
    position: fixed; z-index: 50; inset: auto 0 0 0; max-height: 86vh;
    background: var(--surface); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
  }
  @media (min-width: 800px) {
    .sheet { inset: 50% auto auto 50%; transform: translate(-50%,-50%);
             width: min(900px, 92vw); max-height: 86vh; border-radius: 16px; border: 1px solid var(--line); }
  }
  .sheet-head { display: flex; align-items: center; gap: .5rem; padding: .85rem 1rem; border-bottom: 1px solid var(--line); }
  .sheet-body { overflow: auto; padding: 1rem; -webkit-overflow-scrolling: touch; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { background: none; border: none; padding: .45rem .85rem; border-radius: 8px; font-size: .87rem; min-height: 38px; }
  .seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-in); font-weight: 600; }
  select, input[type=file] {
    font-size: 16px; padding: .6rem; background: var(--surface-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; max-width: 100%;
  }
  .pick-grid { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); margin-top: .9rem; }
  .pick { aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
          background: var(--surface-2); padding: 0; position: relative; }
  .pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick:disabled { opacity: .45; }
  .drop {
    border: 2px dashed var(--line); border-radius: var(--radius); padding: 2rem 1rem;
    text-align: center; color: var(--text-dim);
  }
  .drop.over { border-color: var(--accent); color: var(--text); }

  /* ---------- editor ---------- */
  .hero-wrap {
    position: relative; border-radius: var(--radius); overflow: hidden;
    background: #0B0D10; border: 1px solid var(--line);
    min-height: 220px;
  }
  /* Absolutely positioned, NOT a centred grid item. As a grid item with
     `place-items: center` the image is auto-height, so `height:100%` and
     `max-height:100%` had no definite parent height to resolve against and
     silently did nothing -- the image rendered at full intrinsic height
     inside a shorter box and `overflow:hidden` cropped it. A portrait photo
     came out cropped to a letterbox of its middle, and object-fit never got
     a chance. `inset: 0` gives a definite box, so `contain` works. */
  .hero-wrap img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  #hero-orig { opacity: 0; transition: opacity .12s; pointer-events: none; }
  .hero-wrap.comparing #hero-orig { opacity: 1; }
  .hero-wrap.loading::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, #FFFFFF14, transparent);
    animation: sweep 1s linear infinite;
  }
  @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  /* Crop overlay: the frame is drawn ON the photo, because picking a crop
     from a chip and seeing nothing change is the same complaint as the
     strength slider had. Drag inside to reposition, drag a corner to resize;
     the aspect ratio of the chosen preset is preserved. */
  .crop-layer { position: absolute; inset: 0; grid-area: 1/1; touch-action: none; }
  .crop-shade { position: absolute; background: #000A; pointer-events: none; }
  .crop-box {
    position: absolute; border: 1px solid #FFFD; cursor: move;
    box-shadow: 0 0 0 9999px transparent;
  }
  .crop-box::before, .crop-box::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    border-color: #FFFFFF55; border-style: solid;
  }
  .crop-box::before { border-width: 0 1px; left: 33.33%; right: 33.33%; }
  .crop-box::after  { border-width: 1px 0; top: 33.33%; bottom: 33.33%; }
  .crop-h {
    position: absolute; width: 26px; height: 26px; border: 2px solid #fff;
    background: #0006; border-radius: 3px;
  }
  .crop-h[data-c=nw] { left: -13px; top: -13px; cursor: nwse-resize; }
  .crop-h[data-c=ne] { right: -13px; top: -13px; cursor: nesw-resize; }
  .crop-h[data-c=sw] { left: -13px; bottom: -13px; cursor: nesw-resize; }
  .crop-h[data-c=se] { right: -13px; bottom: -13px; cursor: nwse-resize; }

  .hero-tag {
    position: absolute; top: .6rem; left: .6rem; font-size: .72rem;
    background: #000A; padding: .25rem .6rem; border-radius: 999px; pointer-events: none;
  }
  .compare-btn {
    position: absolute; right: .6rem; bottom: .6rem; font-size: .78rem;
    background: #000A; border: 1px solid #FFF2; border-radius: 999px; padding: .4rem .8rem;
    min-height: 40px; user-select: none; -webkit-user-select: none; touch-action: none;
  }

  /* Wide screens: photo left, controls right. Scrolling between the image
     and the slider that changes it is the thing that made the old gallery
     feel like a form rather than an editor. */
  @media (min-width: 900px) {
    #view-editor {
      display: grid; grid-template-columns: minmax(0, 1fr) 360px;
      gap: 1.5rem; align-items: stretch; height: 100%; min-height: 0;
    }
    .hero-wrap { height: 100%; min-height: 0; }
    /* Only the controls scroll. The photo stays put, which is the whole
       point of a full-frame editor. */
    .rail { min-width: 0; overflow-y: auto; height: 100%;
            padding-right: .35rem; overscroll-behavior: contain; }
    .rail .panel:first-child { margin-top: 0; }
    .dl-bar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); }
  }
  /* Phone: the photo takes whatever height is left after the controls, and
     the controls scroll under it. No page scroll, so the download button is
     always reachable. */
  @media (max-width: 899px) {
    #view-editor { gap: .6rem; }
    /* A definite height, not max-height: percentages inside need something
       real to resolve against. */
    .hero-wrap { flex: 0 0 auto; height: 42dvh; }
    .rail { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch; }
  }

  .panel { margin-top: 1rem; }
  .panel > .label {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: .78rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: .07em; margin-bottom: .5rem;
  }
  .strength-row { display: flex; align-items: center; gap: .8rem; }
  input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 40px; }
  .strength-row output { font-variant-numeric: tabular-nums; font-size: .9rem; min-width: 3.2rem; text-align: right; }

  .film { display: flex; gap: .55rem; overflow-x: auto; padding-bottom: .4rem; scroll-snap-type: x proximity; }
  .film::-webkit-scrollbar { height: 6px; }
  .film::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .look {
    flex: 0 0 auto; width: 104px; background: none; border: none; padding: 0;
    scroll-snap-align: start; text-align: center;
  }
  .look img {
    width: 104px; height: 74px; object-fit: cover; border-radius: 9px; display: block;
    border: 2px solid transparent; transition: border-color .12s;
  }
  .look[aria-pressed="true"] img { border-color: var(--accent); }
  .look span { display: block; font-size: .7rem; margin-top: .25rem; color: var(--text-dim);
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .look[aria-pressed="true"] span { color: var(--text); }

  .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
  .chip {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
    padding: .35rem .8rem; font-size: .8rem; min-height: 38px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-in); border-color: var(--accent); font-weight: 600; }

  .dl-bar { position: sticky; bottom: 0; margin-top: 1.25rem; padding: .9rem 0 1rem;
            background: linear-gradient(transparent, var(--bg) 28%); }
  .dl-bar .btn { width: 100%; }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: .7rem; }
  .bar > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .3s ease; }
  .dl-status { display: flex; justify-content: space-between; font-size: .78rem; color: var(--text-dim); margin-top: .4rem; }

  @media (max-width: 560px) {
    main { padding: .75rem; }
    .look, .look img { width: 92px; }
    .look img { height: 66px; }
  }
</style>
</head>
<body>

<header style="position:sticky; top:0;">
  <button id="back" class="icon-btn" hidden aria-label="Back to library">←</button>
  <div class="title" id="head-title">photo-enhance</div>
  <div class="meta">
    <button id="delete" class="icon-btn" hidden aria-label="Delete this photo"
            title="Delete this photo and its renders">🗑</button>
    <span id="whoami"></span>
    <a href="/settings">Settings</a>
  </div>
</header>

<div id="toast" role="status" aria-live="polite"></div>

<!-- ============ LIBRARY ============ -->
<main id="view-library">
  <div class="lib-head">
    <h2>Your photos</h2>
    <button class="btn" id="open-picker">Add photos</button>
  </div>
  <div id="lib-grid" class="lib-grid"></div>
</main>

<!-- ============ EDITOR ============ -->
<main id="view-editor" hidden>
  <div class="hero-wrap" id="hero-wrap">
    <img id="hero" alt="Preview of the selected look" />
    <img id="hero-orig" alt="The original photo, for comparison" />
    <div class="crop-layer" id="crop-layer" hidden></div>
    <span class="hero-tag" id="hero-tag"></span>
    <button class="compare-btn" id="compare">Hold to compare</button>
  </div>

  <div class="rail">
  <div class="panel">
    <div class="label"><span>Strength</span><span id="strength-hint"></span></div>
    <div class="strength-row">
      <input type="range" id="strength" min="0" max="100" step="5" value="100"
             aria-label="Look strength" />
      <output id="strength-out">100%</output>
    </div>
  </div>

  <div class="panel" id="denoise-panel" hidden>
    <div class="label"><span>Denoise</span><span id="denoise-hint"></span></div>
    <div class="strength-row">
      <input type="range" id="denoise" min="0" max="100" step="5" value="90"
             aria-label="Denoise amount" />
      <output id="denoise-out">90%</output>
    </div>
  </div>

  <div class="panel">
    <div class="label"><span>Looks</span></div>
    <div class="chips" id="look-groups" style="margin-bottom:.6rem"></div>
    <div class="film" id="film"></div>
  </div>

  <div class="panel">
    <div class="label"><span>Download size</span><span id="size-hint"></span></div>
    <div class="chips" id="sizes"></div>
  </div>

  <div class="panel" id="crop-panel" hidden>
    <div class="label"><span>Crop</span></div>
    <div id="crops"></div>
  </div>

  <div class="panel" id="motion-panel" hidden>
    <div class="label"><span>3D motion</span><span style="text-transform:none;letter-spacing:0">from the depth map</span></div>
    <div class="chips">
      <button class="chip" id="gif-wiggle">Parallax GIF</button>
      <button class="chip" id="gif-turn">Head turn GIF</button>
    </div>
  </div>

  <div class="dl-bar">
    <button class="btn" id="download">Download full resolution</button>
    <div id="dl-progress" hidden>
      <div class="bar"><i id="dl-fill"></i></div>
      <div class="dl-status"><span id="dl-msg"></span><span id="dl-pct"></span></div>
    </div>
  </div>
  </div>
</main>

<script>
// ---------------------------------------------------------------- utilities
const $ = (id) => document.getElementById(id);
let toastTimer = null;
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), isErr ? 6000 : 2800);
}
async function jget(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

const state = {
  imports: [],
  catalogue: [],      // [{key,label,group}]
  current: null,      // the open import's meta
  style: null,
  strength: 100,
  crop: '',
  cropRect: null,
  denoise: null,     // null = this photo has none available
  size: 'original',
  sizes: [],
  group: 'smart',
};

// ---------------------------------------------------------------- library
async function loadLibrary() {
  const grid = $('lib-grid');
  try {
    state.imports = await jget('/api/gallery');
  } catch (e) {
    grid.innerHTML = '';
    toast('Could not load your photos: ' + e, true);
    return;
  }
  renderLibrary();
}

function renderLibrary() {
  const grid = $('lib-grid');
  const pending = [...grid.querySelectorAll('.tile.pending')];
  grid.innerHTML = '';
  if (!state.imports.length && !pending.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <p>Nothing here yet.</p><p style="font-size:.9rem">Add a photo from Immich or upload a RAW file.</p></div>`;
    return;
  }
  for (const p of pending) grid.appendChild(p);
  for (const imp of state.imports) {
    const b = document.createElement('button');
    b.className = 'tile';
    b.innerHTML = `
      <img src="/api/gallery/${imp.id}/original_thumb.jpg" loading="lazy" alt="" />
      ${(imp.region_recipes && imp.region_recipes.length) ? '<span class="badge">smart</span>' : ''}
      <span class="cap">${escapeHtml(imp.source_name || 'photo')}</span>`;
    b.addEventListener('click', () => openEditor(imp.id));
    grid.appendChild(b);
  }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addPendingTile(name) {
  const grid = $('lib-grid');
  const empty = grid.querySelector('.empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'tile pending';
  d.innerHTML = `<div class="spinner"></div><span class="cap">${escapeHtml(name)}</span>`;
  grid.prepend(d);
  return d;
}

// ---------------------------------------------------------------- picker
let picker = null;
function openPicker() {
  if (picker) return;
  const back = document.createElement('div');
  back.className = 'sheet-back';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="sheet-head">
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="true" data-src="immich">From Immich</button>
        <button role="tab" aria-selected="false" data-src="upload">Upload</button>
      </div>
      <div style="flex:1"></div>
      <button class="icon-btn" id="close-picker" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <div data-pane="immich">
        <select id="album-select"><option value="">All photos</option></select>
        <div class="pick-grid" id="pick-grid"></div>
        <div style="text-align:center"><button class="btn ghost" id="load-more" hidden
             style="margin-top:1rem">Load more</button></div>
      </div>
      <div data-pane="upload" hidden>
        <div class="drop" id="drop">
          <p>Drop a CR3 / ARW / DNG / JPEG here</p>
          <input type="file" id="file-input"
                 accept=".cr3,.arw,.dng,.cr2,.nef,.jpg,.jpeg,.png" />
        </div>
      </div>
    </div>`;
  document.body.append(back, sheet);
  picker = { back, sheet };
  back.addEventListener('click', closePicker);
  sheet.querySelector('#close-picker').addEventListener('click', closePicker);
  sheet.querySelectorAll('[role=tab]').forEach(t => t.addEventListener('click', () => {
    sheet.querySelectorAll('[role=tab]').forEach(x => x.setAttribute('aria-selected', String(x === t)));
    sheet.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== t.dataset.src; });
  }));
  sheet.querySelector('#album-select').addEventListener('change', e => loadImmich(e.target.value, true));
  sheet.querySelector('#load-more').addEventListener('click', () => loadImmich(immich.album, false));
  wireUpload(sheet);
  loadAlbums();
  loadImmich('', true);
}
function closePicker() {
  if (!picker) return;
  picker.back.remove(); picker.sheet.remove(); picker = null;
}

const immich = { album: '', next: null, busy: false };
async function loadAlbums() {
  try {
    const albums = await jget('/api/immich/albums');
    const sel = $('album-select');
    for (const a of albums) {
      const o = document.createElement('option');
      o.value = a.id; o.textContent = `${a.albumName} (${a.assetCount})`;
      sel.appendChild(o);
    }
  } catch (e) { toast('Could not load albums: ' + e, true); }
}
async function loadImmich(album, reset) {
  if (immich.busy) return;
  immich.busy = true;
  if (reset) { immich.album = album; immich.next = null; $('pick-grid').innerHTML = ''; }
  const params = new URLSearchParams();
  if (immich.album) params.set('album_id', immich.album);
  if (immich.next) params.set('page', immich.next);
  try {
    const res = await jget('/api/immich/search?' + params.toString());
    const grid = $('pick-grid');
    for (const a of res.items) {
      const b = document.createElement('button');
      b.className = 'pick';
      b.title = a.originalFileName || '';
      b.innerHTML = `<img src="/api/immich/thumbnail/${a.id}" loading="lazy" alt="" />`;
      b.addEventListener('click', () => importPhoto(
        () => fetch(`/api/import/immich/${a.id}`, { method: 'POST' }),
        a.originalFileName || 'photo', b));
      grid.appendChild(b);
    }
    immich.next = res.nextPage;
    $('load-more').hidden = !res.nextPage;
  } catch (e) {
    toast('Could not load photos: ' + e, true);
  } finally { immich.busy = false; }
}
function wireUpload(sheet) {
  const drop = sheet.querySelector('#drop');
  const input = sheet.querySelector('#file-input');
  input.addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) sendUpload(f);
  });
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0];
    if (f) sendUpload(f);
  });
}
function sendUpload(file) {
  const form = new FormData();
  form.append('file', file);
  importPhoto(() => fetch('/api/import/upload', { method: 'POST', body: form }), file.name, null);
}

// One place for "a photo is being brought in": the tile appears in the
// library immediately, so the work is visible where the result will land
// rather than behind a tab you have to remember to visit.
async function importPhoto(startFn, name, btn) {
  closePicker();
  const tile = addPendingTile(name);
  if (btn) btn.disabled = true;
  toast(`Processing ${name}…`);
  try {
    const res = await startFn();
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { import_id } = await res.json();
    tile.remove();
    const wasEditing = !!state.current;
    if (wasEditing) {
      // Do NOT yank the user out of the photo they are working on. Imports
      // finish minutes later; jumping the view is the kind of "helpful" that
      // loses someone's place.
      toast(`${name} is ready — it's in your library`);
    } else {
      await loadLibrary();
      toast('Ready');
      openEditor(import_id);
    }
  } catch (e) {
    tile.remove();
    renderLibrary();
    toast(`Could not process ${name}: ${e}`, true);
  } finally {
    if (btn) btn.disabled = false;
    // Refresh the underlying list so the new photo is there when they go
    // back, without changing what is on screen right now.
    if (state.current) {
      try { state.imports = await jget('/api/gallery'); } catch (_) {}
    }
  }
}

// ---------------------------------------------------------------- editor
async function openEditor(importId) {
  let meta;
  try { meta = await jget('/api/gallery/' + importId); }
  catch (e) { return toast('Could not open that photo: ' + e, true); }
  state.current = meta;
  state.strength = 100;
  state.crop = '';
  state.cropRect = null;
  const region = meta.region_recipes || [];
  state.group = region.length ? 'smart' : 'signature';
  state.style = (meta.styles[0] || {}).key || null;

  $('view-library').hidden = true;
  $('view-editor').hidden = false;
  $('back').hidden = false;
  $('delete').hidden = false;
  resetDelete();
  $('head-title').textContent = meta.source_name || 'photo';
  $('strength').value = 100;
  $('strength-out').textContent = '100%';
  // Only offered when the import actually measured noisy -- a denoise slider
  // on a clean daylight frame is a control that can only make things worse.
  const dn = meta.denoise || {};
  if (dn.available) {
    state.denoise = Math.round((dn.amount ?? 0.9) * 100);
    $('denoise-panel').hidden = false;
    $('denoise').value = state.denoise;
    $('denoise-out').textContent = state.denoise + '%';
    $('denoise-hint').textContent = `noise ${Number(dn.sigma).toFixed(1)}`;
  } else {
    state.denoise = null;
    $('denoise-panel').hidden = true;
  }
  $('hero-orig').src = `/api/gallery/${meta.id}/original_thumb.jpg`;
  paintProgress();
  renderGroups();
  renderFilm();
  // Offered only when this import actually has a depth map -- the GIF is
  // re-projection of the depth, so without one there is nothing to animate.
  // 3D motion GIFs are parked: the endpoint and the renderer stay, but the
  // buttons are hidden until they earn their place in the editor.
  $('motion-panel').hidden = true;
  renderSizes();
  renderCrops();
  updateHero();
  window.scrollTo({ top: 0 });
}
function closeEditor() {
  $('view-editor').hidden = true;
  $('view-library').hidden = false;
  $('back').hidden = true;
  $('delete').hidden = true;
  resetDelete();
  $('head-title').textContent = 'photo-enhance';
  state.current = null;
  loadLibrary();
}

function groupsFor(meta) {
  const region = new Set(meta.region_recipes || []);
  const known = new Map(state.catalogue.map(s => [s.key, s.group]));
  const out = { smart: [], signature: [], cinematic: [] };
  for (const s of meta.styles) {
    const g = region.has(s.key) ? 'smart' : (known.get(s.key) || 'signature');
    out[g].push(s);
  }
  return out;
}
const GROUP_LABEL = { smart: 'For this photo', signature: 'Signature', cinematic: 'Cinematic' };

function renderGroups() {
  const groups = groupsFor(state.current);
  const box = $('look-groups');
  box.innerHTML = '';
  for (const key of ['smart', 'signature', 'cinematic']) {
    if (!groups[key].length) continue;
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(state.group === key));
    b.textContent = `${GROUP_LABEL[key]} (${groups[key].length})`;
    b.addEventListener('click', () => { state.group = key; renderGroups(); renderFilm(); });
    box.appendChild(b);
  }
}

function renderFilm() {
  const groups = groupsFor(state.current);
  const list = groups[state.group] || [];
  const film = $('film');
  film.innerHTML = '';
  // "Original" is a look you can choose, not a separate concept -- it is the
  // model's corrected baseline at strength 0.
  for (const s of list) {
    const b = document.createElement('button');
    b.className = 'look';
    b.setAttribute('aria-pressed', String(s.key === state.style));
    b.innerHTML = `<img src="/api/gallery/${state.current.id}/${s.key}_thumb.jpg" loading="lazy" alt="" />
                   <span>${escapeHtml(s.label)}</span>`;
    b.addEventListener('click', () => {
      state.style = s.key;
      renderFilm();
      updateHero();
      resetProgress();
    });
    film.appendChild(b);
  }
  if (list.length && !list.some(s => s.key === state.style)) {
    state.style = list[0].key;
    renderFilm();
    updateHero();
  }
}

// The crop rectangle lives in fractions of the frame, so it survives every
// resolution the preview and the final render happen at.
function cropFromPreset(c) {
  const ref = state.current.crop_ref || {};
  const rw = ref.w || 1, rh = ref.h || 1;
  return { x: c.x / rw, y: c.y / rh, w: c.w / rw, h: c.h / rh };
}

function drawCrop() {
  const layer = $('crop-layer');
  const r = state.cropRect;
  if (!r) { layer.hidden = true; layer.innerHTML = ''; return; }
  const img = $('hero');
  // The image is object-fit: contain, so the painted area may be smaller
  // than the layer -- the box has to track the picture, not the box element.
  const cw = img.clientWidth, ch = img.clientHeight;
  const nw = img.naturalWidth || cw, nh = img.naturalHeight || ch;
  const scale = Math.min(cw / nw, ch / nh) || 1;
  const pw = nw * scale, ph = nh * scale;
  const ox = (cw - pw) / 2, oy = (ch - ph) / 2;
  const L = ox + r.x * pw, T = oy + r.y * ph, W = r.w * pw, H = r.h * ph;
  layer.hidden = false;
  layer.innerHTML = `
    <div class="crop-shade" style="left:0;top:0;right:0;height:${T}px"></div>
    <div class="crop-shade" style="left:0;top:${T + H}px;right:0;bottom:0"></div>
    <div class="crop-shade" style="left:0;top:${T}px;width:${L}px;height:${H}px"></div>
    <div class="crop-shade" style="left:${L + W}px;top:${T}px;right:0;height:${H}px"></div>
    <div class="crop-box" id="crop-box" style="left:${L}px;top:${T}px;width:${W}px;height:${H}px">
      <div class="crop-h" data-c="nw"></div><div class="crop-h" data-c="ne"></div>
      <div class="crop-h" data-c="sw"></div><div class="crop-h" data-c="se"></div>
    </div>`;
  wireCropDrag(pw, ph, ox, oy);
}

function wireCropDrag(pw, ph, ox, oy) {
  const box = $('crop-box');
  if (!box) return;
  const start = (e, mode) => {
    e.preventDefault(); e.stopPropagation();
    const r0 = { ...state.cropRect };
    const sx = e.clientX, sy = e.clientY;
    const ar = r0.w * pw / (r0.h * ph);
    const move = (ev) => {
      const dx = (ev.clientX - sx) / pw, dy = (ev.clientY - sy) / ph;
      let r = { ...r0 };
      if (mode === 'move') {
        r.x = Math.min(Math.max(r0.x + dx, 0), 1 - r0.w);
        r.y = Math.min(Math.max(r0.y + dy, 0), 1 - r0.h);
      } else {
        // Resize about the opposite corner, keeping the preset's aspect.
        const signX = mode.includes('e') ? 1 : -1;
        let w = Math.min(Math.max(r0.w + signX * dx, 0.05), 1);
        let h = w * pw / ar / ph;
        if (h > 1) { h = 1; w = h * ph * ar / pw; }
        r.w = w; r.h = h;
        r.x = mode.includes('e') ? r0.x : r0.x + r0.w - w;
        r.y = mode.includes('s') ? r0.y : r0.y + r0.h - h;
        r.x = Math.min(Math.max(r.x, 0), 1 - w);
        r.y = Math.min(Math.max(r.y, 0), 1 - h);
      }
      state.cropRect = r;
      state.crop = '';           // a dragged frame is no longer a preset
      drawCrop();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      renderCrops();
      resetProgress();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  box.addEventListener('pointerdown', e => {
    if (e.target.classList.contains('crop-h')) return;
    start(e, 'move');
  });
  box.querySelectorAll('.crop-h').forEach(h =>
    h.addEventListener('pointerdown', e => start(e, h.dataset.c)));
}

function renderSizes() {
  const box = $('sizes');
  box.innerHTML = '';
  const list = state.sizes.length ? state.sizes
    : [{ key: 'original', label: 'Original' }];
  for (const sz of list) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(state.size === sz.key));
    b.textContent = sz.label;
    b.addEventListener('click', () => { state.size = sz.key; renderSizes(); resetProgress(); });
    box.appendChild(b);
  }
  // Denoise cost scales with pixels, so a smaller output is dramatically
  // faster on a noisy photo. Say so where the choice is made.
  const sel = list.find(x => x.key === state.size) || {};
  $('size-hint').textContent =
    (state.denoise !== null && state.denoise > 0 && sel.edge) ? 'much faster to render' : '';
}

function renderCrops() {
  const crops = state.current.crops || [];
  $('crop-panel').hidden = !crops.length;
  if (!crops.length) return;
  const box = $('crops');
  box.innerHTML = '';
  // Each group gets its OWN row with the heading above it. The heading used
  // to be an inline chip-sibling, so it landed in the middle of a row and the
  // groups interleaved as they wrapped.
  const row = () => {
    const r = document.createElement('div');
    r.className = 'chips';
    r.style.marginBottom = '.45rem';
    box.appendChild(r);
    return r;
  };
  const heading = (text) => {
    const h = document.createElement('div');
    h.style.cssText = 'width:100%;font-size:.68rem;color:var(--text-dim);'
      + 'text-transform:uppercase;letter-spacing:.09em;margin:.35rem 0 .3rem';
    h.textContent = text;
    box.appendChild(h);
  };
  const mk = (parent, key, label, onPick) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(state.crop === key && !(key === '' && state.cropRect)));
    b.textContent = label;
    b.addEventListener('click', () => { onPick(); renderCrops(); drawCrop(); resetProgress(); });
    parent.appendChild(b);
  };

  const first = row();
  mk(first, '', 'Full frame', () => { state.crop = ''; state.cropRect = null; });

  // Instagram ratios in the order you'd actually reach for them, not in
  // whatever order the crop scorer happened to return.
  const IG_ORDER = ['ig_story', 'ig_portrait', 'ig_square', 'ig_landscape'];
  const byKey = Object.fromEntries(crops.map(c => [c.key, c]));
  const ig = IG_ORDER.map(k => byKey[k]).filter(Boolean);
  if (ig.length) {
    heading('Instagram');
    const r = row();
    for (const c of ig) {
      mk(r, c.key, c.label.replace(/^Instagram /, ''),
         () => { state.crop = c.key; state.cropRect = cropFromPreset(c); });
    }
  }
  const other = crops.filter(c => (c.group || 'classic') !== 'instagram');
  if (other.length) {
    heading('Classic');
    const r = row();
    for (const c of other) {
      mk(r, c.key, c.label, () => { state.crop = c.key; state.cropRect = cropFromPreset(c); });
    }
  }
  if (state.cropRect && !state.crop) {
    const tag = document.createElement('div');
    tag.style.cssText = 'font-size:.75rem;color:var(--text-dim);margin-top:.3rem';
    tag.textContent = 'custom framing — drag on the photo';
    box.appendChild(tag);
  }
}

// Hero updates are preloaded and swapped, so the image never blanks between
// looks -- flicker on every slider step is what makes an editor feel cheap.
let heroToken = 0;
function updateHero() {
  if (!state.current || !state.style) return;
  const token = ++heroToken;
  const wrap = $('hero-wrap');
  const s = state.strength / 100;
  const q = new URLSearchParams();
  if (s < 1) q.set('strength', s.toFixed(2));
  if (state.denoise !== null) q.set('denoise', (state.denoise / 100).toFixed(2));
  const qs = q.toString();
  const url = `/api/gallery/${state.current.id}/${state.style}_preview.jpg`
            + (qs ? `?${qs}` : '');
  const label = (state.current.styles.find(x => x.key === state.style) || {}).label || '';
  $('hero-tag').textContent = state.strength >= 100 ? label : `${label} · ${state.strength}%`;
  wrap.classList.add('loading');
  const img = new Image();
  img.onload = () => {
    if (token !== heroToken) return;
    $('hero').src = img.src;
    wrap.classList.remove('loading');
    drawCrop();
  };
  img.onerror = () => { if (token === heroToken) wrap.classList.remove('loading'); };
  img.src = url;
}

let denoiseTimer = null;
$('denoise').addEventListener('input', e => {
  state.denoise = Number(e.target.value);
  $('denoise-out').textContent = state.denoise + '%';
  clearTimeout(denoiseTimer);
  denoiseTimer = setTimeout(() => { updateHero(); resetProgress(); renderSizes(); }, 140);
});

let strengthTimer = null;
$('strength').addEventListener('input', e => {
  state.strength = Number(e.target.value);
  $('strength-out').textContent = state.strength + '%';
  $('strength-hint').textContent = state.strength === 0 ? 'the untouched photo' : '';
  clearTimeout(strengthTimer);
  strengthTimer = setTimeout(() => { updateHero(); resetProgress(); }, 140);
});

// Press and hold the button (or the image) to see the original.
const wrap = $('hero-wrap');
function compareOn(e) { e.preventDefault(); wrap.classList.add('comparing'); }
function compareOff() { wrap.classList.remove('comparing'); }
for (const el of [$('compare'), $('hero')]) {
  el.addEventListener('pointerdown', compareOn);
  el.addEventListener('pointerup', compareOff);
  el.addEventListener('pointerleave', compareOff);
  el.addEventListener('pointercancel', compareOff);
}
$('compare').addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') compareOn(e); });
$('compare').addEventListener('keyup', compareOff);

// Deleting removes the import and every render under it -- and for an
// uploaded file, the only copy of the source. Confirmed with an anchored
// popover rather than a second click on the same button: a control that
// changes size (and disarms on a timer) moves the target out from under the
// pointer, which is exactly how the first version silently did nothing.
let confirmPop = null;
function resetDelete() {
  if (confirmPop) { confirmPop.remove(); confirmPop = null; }
  $('delete').classList.remove('danger');
}
$('delete').addEventListener('click', () => {
  if (confirmPop) return resetDelete();
  if (!state.current) return;
  const name = state.current.source_name || 'this photo';
  $('delete').classList.add('danger');
  confirmPop = document.createElement('div');
  confirmPop.className = 'confirm-pop';
  confirmPop.innerHTML = `
    <p>Delete <strong>${escapeHtml(name)}</strong>?<br>
       <span class="sub">Its renders go too, and an uploaded original has no other copy.
       This cannot be undone.</span></p>
    <div class="actions">
      <button class="btn ghost" data-act="cancel">Cancel</button>
      <button class="btn destructive" data-act="confirm">Delete</button>
    </div>`;
  document.querySelector('header').appendChild(confirmPop);
  confirmPop.querySelector('[data-act=cancel]').addEventListener('click', resetDelete);
  confirmPop.querySelector('[data-act=confirm]').addEventListener('click', doDelete);
  confirmPop.querySelector('[data-act=confirm]').focus();
});
async function doDelete(e) {
  const btn = e.currentTarget;
  const id = state.current && state.current.id;
  const name = (state.current && state.current.source_name) || 'photo';
  if (!id) return resetDelete();
  btn.disabled = true;
  btn.textContent = 'Deleting…';
  try {
    const r = await fetch('/api/gallery/' + id, { method: 'DELETE' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    resetDelete();
    closeEditor();
    toast(`Deleted ${name}`);
  } catch (err) {
    toast('Could not delete: ' + err, true);
    btn.disabled = false;
    btn.textContent = 'Delete';
  }
}

window.addEventListener('resize', () => { if (state.current) drawCrop(); });
$('hero').addEventListener('load', drawCrop);

async function downloadMotion(mode, btn) {
  if (!state.current) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Rendering…';
  try {
    const r = await fetch(`/api/gallery/${state.current.id}/motion_${mode}.gif`);
    if (!r.ok) throw new Error(await r.text().then(t => t.slice(0, 120)));
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${(state.current.source_name || 'photo').replace(/\.[^.]+$/, '')}_${mode}.gif`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    toast(`Saved ${mode} GIF · ${(blob.size / 1048576).toFixed(1)} MB`);
  } catch (e) {
    toast('Could not make the GIF: ' + e, true);
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}
$('gif-wiggle').addEventListener('click', e => downloadMotion('wiggle', e.currentTarget));
$('gif-turn').addEventListener('click', e => downloadMotion('turn', e.currentTarget));

$('back').addEventListener('click', closeEditor);
$('open-picker').addEventListener('click', openPicker);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (picker) closePicker();
    else if (confirmPop) resetDelete();
    else if (state.current) closeEditor();
  }
});

// ---------------------------------------------------------------- download
// Downloads are tracked PER PHOTO. The progress elements are single, shared
// DOM nodes, so two concurrent downloads both wrote to them and the bar
// flickered between the two jobs once a second. Now each job records its own
// state, and only the photo currently open paints the bar; the others finish
// quietly and announce themselves.
const jobs = new Map();   // importId -> {pct, msg, state, name}

function paintProgress() {
  const id = state.current && state.current.id;
  const j = id ? jobs.get(id) : null;
  if (!j) {
    $('dl-progress').hidden = true;
    $('dl-fill').style.width = '0%';
    $('download').disabled = false;
    $('download').textContent = 'Download full resolution';
    return;
  }
  $('dl-progress').hidden = false;
  $('dl-fill').style.width = Math.max(2, j.pct) + '%';
  $('dl-msg').textContent = j.msg || '';
  $('dl-pct').textContent = j.pct + '%';
  const running = j.state === 'running';
  $('download').disabled = running;
  $('download').textContent = running ? 'Working…'
    : (j.state === 'done' ? 'Download again' : 'Try again');
}

function resetProgress() {
  const id = state.current && state.current.id;
  if (id && (jobs.get(id) || {}).state !== 'running') jobs.delete(id);
  paintProgress();
}
function setProgress(importId, pct, msg, st) {
  const j = jobs.get(importId) || {};
  jobs.set(importId, { ...j, pct, msg, state: st || j.state || 'running' });
  paintProgress();
}

$('download').addEventListener('click', async () => {
  if (!state.current || !state.style) return;
  // Capture what is being downloaded NOW: the user may open another photo
  // while this runs, and the job must not follow them.
  const imp = state.current;
  const name = `${(imp.source_name || 'photo').replace(/\.[^.]+$/, '')}`
    + `_${state.style}${state.crop ? '_' + state.crop : ''}`
    + `${state.strength < 100 ? '_' + state.strength + 'pct' : ''}`
    + `${state.denoise !== null && state.denoise > 0 ? '_dn' + state.denoise : ''}`
    + `${state.size !== 'original' ? '_' + state.size : ''}.jpg`;

  const form = new FormData();
  form.append('import_id', imp.id);
  form.append('style_key', state.style);
  if (state.cropRect && !state.crop) {
    const r = state.cropRect;
    form.append('crop_rect', [r.x, r.y, r.w, r.h].map(v => v.toFixed(4)).join(','));
  } else if (state.crop) {
    form.append('crop', state.crop);
  }
  form.append('strength', (state.strength / 100).toFixed(2));
  if (state.denoise !== null) form.append('denoise', (state.denoise / 100).toFixed(2));
  form.append('size', state.size);

  setProgress(imp.id, 2, 'Starting', 'running');
  try {
    const res = await fetch('/api/render', { method: 'POST', body: form });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { job_id } = await res.json();
    const url = await pollJob(job_id, imp.id);
    setProgress(imp.id, 100, 'Downloading', 'running');
    const blob = await fetch(url).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.blob();
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    setProgress(imp.id, 100, `Saved · ${(blob.size / 1048576).toFixed(1)} MB`, 'done');
    toast(`Saved ${name}`);
  } catch (e) {
    setProgress(imp.id, 0, 'Failed', 'error');
    toast(`Download failed (${imp.source_name || 'photo'}): ${e}`, true);
  }
});

function pollJob(jobId, importId) {
  return new Promise((resolve, reject) => {
    const tick = async () => {
      try {
        const j = await jget('/api/render/' + jobId);
        if (j.state === 'error') return reject(new Error(j.error || 'render failed'));
        setProgress(importId, j.pct ?? 0, j.message || '', 'running');
        if (j.state === 'done') return resolve(j.url);
        setTimeout(tick, 600);
      } catch (e) { reject(e); }
    };
    tick();
  });
}

// ---------------------------------------------------------------- boot
(async function boot() {
  try {
    const me = await jget('/api/me');
    $('whoami').textContent = me.username || '';
  } catch (e) { /* the page is behind auth anyway */ }
  try { state.catalogue = await jget('/api/styles'); } catch (e) { state.catalogue = []; }
  try { state.sizes = await jget('/api/sizes'); } catch (e) { state.sizes = []; }
  await loadLibrary();
})();
</script>
