name: Build and publish image

on:
  push:
    branches: [main]
    # The Android app is not in this image's build context, so a commit that
    # only touches it would republish a byte-identical image.
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  # Pull requests run the checks but do not publish. Without this the tests
  # only ran after a merge, which is the wrong side of the decision: a branch
  # could be reviewed, merged, and only then found to be broken.
  pull_request:
    paths-ignore: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # A SyntaxError anywhere in an inline <script> kills that whole block,
      # so the page silently does nothing. That shipped once (a duplicate
      # `const url` broke the gallery entirely) because the backend was
      # tested via curl and the page was never loaded afterwards.
      - name: Syntax-check inline page JavaScript
        run: |
          python3 - <<'EOF'
          import re, pathlib, subprocess, sys
          fail = False
          for f in pathlib.Path("service/static").glob("*.html"):
              for i, js in enumerate(re.findall(r"<script>(.*?)</script>", f.read_text(), re.S)):
                  p = pathlib.Path(f"/tmp/{f.name}.{i}.js"); p.write_text(js)
                  r = subprocess.run(["node", "--check", str(p)], capture_output=True, text=True)
                  print(f"{f.name}[{i}]: {'OK' if r.returncode == 0 else 'SYNTAX ERROR'}")
                  if r.returncode:
                      print(r.stderr); fail = True
          sys.exit(1 if fail else 0)
          EOF

      # A pending photo must have exactly ONE source of truth. It briefly had
      # two -- a browser-side placeholder AND the server's /api/gallery entry --
      # and because renderLibrary() also carried old `.tile.pending` nodes
      # across renders, four queued photos grew by four more every 4s poll.
      # Parsing and the route smoke test both pass happily through that.
      - name: One source of truth for pending tiles
        run: |
          python3 - <<'EOF'
          import pathlib, sys
          js = pathlib.Path("service/static/index.html").read_text()
          n = js.count("'tile pending'")
          carry = "querySelectorAll('.tile.pending')" in js
          print(f"places creating a pending tile: {n}; carries tiles across renders: {carry}")
          if n != 1 or carry:
              print("FAIL: pending tiles must be created in exactly one place, "
                    "from state.imports only, and never preserved across renders.")
              sys.exit(1)
          EOF

      # Parsing is not enough. Twice a string edit added an argument to a
      # call site whose function had no such parameter -- the module imported
      # cleanly and only blew up on a real request, once shipping a broken
      # editor preview. This calls every route the UI calls.
      - name: Smoke-test the API routes
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r service/requirements.txt httpx
          python tests/smoke_test.py


      # These three were in the repository but not in this file, which is how
      # a commit shipped that referenced a lock it never defined: every GPU
      # denoise raised NameError, and denoise_shape_test.py -- which catches
      # exactly that -- was never run.
      - name: Unit tests
        run: |
          python tests/border_trim_test.py
          python tests/denoise_shape_test.py
          python tests/ov_concurrency_test.py
          python tests/guided_chroma_test.py
          python tests/ffdnet_test.py

      # research/ imports from service/, so renaming anything it calls breaks
      # it silently. Importing costs a second and catches that; running them
      # properly needs a RAW file and model weights, so it stays manual.
      - name: Research scripts still import
        run: |
          for f in research/*/*.py; do
            PYTHONPATH=research/denoise-speed python -c "import runpy,sys; runpy.run_path('$f', run_name='probe')" || exit 1
            echo "ok $f"
          done

      # The storage row is created partway through an import, while the
      # placeholder is still registered. Both were returned, so one photo
      # showed as a spinner AND a half-built tile you could click into.
      - name: A processing photo appears once in the gallery
        run: |
          python tests/pending_test.py

      # The two suites above run in-process against a TestClient, which skips
      # the HTTP middleware, real sessions and the background task machinery.
      # This one drives a running server the way a client does: auth
      # boundaries, per-user isolation, upload, render, delete. Classic mode
      # keeps it to seconds -- enhanced would pull ~250MB of segmentation
      # weights on the runner for no extra coverage of the wiring.
      - name: End-to-end against a running server
        run: |
          DATA=$(mktemp -d)/data
          mkdir -p "$DATA/_config"
          echo '{"mode":"classic","jpeg_quality":95,"max_concurrent_jobs":2}' > "$DATA/_config/settings.json"
          (cd service && RENDER_STORAGE_DIR="$DATA" python -m uvicorn main:app --host 127.0.0.1 --port 5099 &)
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:5099/health >/dev/null && break || sleep 2
          done
          python tests/e2e_test.py --base http://127.0.0.1:5099
          status=$?
          pkill -f 'port 5099' 2>/dev/null || true
          exit $status

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: service/Dockerfile
          push: true
          tags: ghcr.io/akopmm/photo-enhance:latest
