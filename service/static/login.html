<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>photo-enhance · sign in</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .card { width: 100%; max-width: 360px; border: 1px solid #8883; border-radius: 12px; padding: 1.5rem; }
  h1 { font-size: 1.15rem; margin: 0 0 0.25rem; }
  p.sub { margin: 0 0 1.25rem; opacity: 0.65; font-size: 0.85rem; }
  label { display: block; font-size: 0.8rem; opacity: 0.8; margin-bottom: 0.25rem; }
  input { width: 100%; box-sizing: border-box; font-size: 1rem; padding: 0.6rem;
          border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit;
          margin-bottom: 0.9rem; }
  button { width: 100%; font-size: 1rem; padding: 0.65rem; border: none; border-radius: 8px;
           background: #7c7cf5; color: white; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg { font-size: 0.85rem; min-height: 1.2em; margin-top: 0.75rem; }
  #msg.err { color: #e5484d; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Sign in</h1>
  <p class="sub" id="subtitle">photo-enhance</p>
  <form id="form">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="none" required />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required />
    <button id="go" type="submit">Sign in</button>
  </form>
  <div id="msg"></div>
</div>

<script>
let needsSetup = false;

async function init() {
  try {
    const s = await fetch('/api/bootstrap-state').then(r => r.json());
    needsSetup = !!s.needs_setup;
  } catch (e) { /* fall through to normal login */ }
  if (needsSetup) {
    document.getElementById('title').textContent = 'Create admin account';
    document.getElementById('subtitle').textContent =
      'First run — this account will administer the instance.';
    document.getElementById('go').textContent = 'Create account';
    document.getElementById('p').setAttribute('autocomplete', 'new-password');
  }
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const msg = document.getElementById('msg');
  btn.disabled = true; msg.className = ''; msg.textContent = '';
  const body = new FormData(e.target);
  try {
    const res = await fetch(needsSetup ? '/api/setup' : '/api/login', { method: 'POST', body });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.detail || `HTTP ${res.status}`);
    }
    location.href = '/';
  } catch (err) {
    msg.className = 'err';
    msg.textContent = err.message;
    btn.disabled = false;
  }
});

init();
</script>
</body>
</html>
